<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  
  <!-- 防止搜尋引擎收錄與爬蟲抓取 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  
  <!-- 預載關鍵圖片，切換瞬間零延遲 -->
  <link rel="preload" href="Block.webp" as="image">
  <link rel="preload" href="Heart.webp" as="image">
  
  <title>存取驗證</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-container">
    <div class="auth-card" id="cardContainer">
      
      <!-- 非開放時間 / 密碼驗證區塊 -->
      <div id="lockState" class="state-container">
        <!-- 圖片（正常為 Warning，封鎖後立即切換為 Block） -->
        <div class="image-wrapper">
          <img src="Warning.webp" alt="Warning" class="warning-image" id="lockImage" draggable="false">
          <img src="Block.webp" alt="Blocked" class="warning-image hidden" id="blockImage" draggable="false">
        </div>

        <!-- 倒數計時與專案展提醒 -->
        <div class="countdown-card" id="countdownCard">
          <div class="notice-badge">專案展才會開放！</div>
          <div class="countdown-timer" aria-label="開放倒數計時">
            <div class="timer-segment">
              <span class="timer-num" id="cdDays">00</span>
              <span class="timer-label">天</span>
            </div>
            <span class="timer-colon">:</span>
            <div class="timer-segment">
              <span class="timer-num" id="cdHours">00</span>
              <span class="timer-label">時</span>
            </div>
            <span class="timer-colon">:</span>
            <div class="timer-segment">
              <span class="timer-num" id="cdMinutes">00</span>
              <span class="timer-label">分</span>
            </div>
            <span class="timer-colon">:</span>
            <div class="timer-segment">
              <span class="timer-num" id="cdSeconds">00</span>
              <span class="timer-label">秒</span>
            </div>
          </div>
        </div>

        <!-- 標題與提示訊息 -->
        <div class="header-group" id="lockHeaderGroup">
          <h1 class="title">你是誰啊？</h1>
          <p class="subtitle">你想在非開放時間就偷偷用？</p>
          <div class="divider"></div>
          <p class="prompt">那就輸入密碼</p>
        </div>

        <!-- 封鎖訊息（連續錯誤 3 次後顯示） -->
        <div id="blockedMsg" class="blocked-message hidden">
          不知道密碼就不要猜，開放時間後再來吧
        </div>

        <!-- 密碼輸入表單 -->
        <form id="passwordForm" class="auth-form" onsubmit="return false;" autocomplete="off">
          <div class="input-control">
            <div class="input-wrapper">
              <span class="icon-prefix" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="text" 
                id="passwordInput" 
                placeholder="請輸入解鎖密碼..." 
                maxlength="30"
                required
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
              >
            </div>
            
            <button type="submit" id="submitBtn" class="submit-button">
              <span>確認送出</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>

          <div id="errorMessage" class="error-feedback" role="alert" aria-live="polite"></div>
        </form>
      </div>

      <!-- 選擇版本畫面 (時間到或密碼正確後顯示) -->
      <div id="choiceState" class="state-container hidden">
        <!-- Heart 圖片 -->
        <div class="image-wrapper">
          <img src="Heart.webp" alt="Heart" class="warning-image" draggable="false">
        </div>

        <div class="header-group">
          <h1 class="title">選擇使用方式</h1>
          <p class="subtitle">請選擇您要前往的版本</p>
        </div>

        <div class="choice-buttons">
          <button type="button" id="btnApp" class="choice-btn choice-btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3l14 9-14 9V3z"></path>
            </svg>
            <span>Google Play 商店（App）</span>
          </button>
          <button type="button" id="btnWeb" class="choice-btn choice-btn-secondary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span>網頁版</span>
          </button>
        </div>

        <p class="choice-hint">⚠ 網頁版使用起來效果差，建議使用 App</p>
      </div>

      <!-- 跳轉中畫面 -->
      <div id="redirectState" class="state-container hidden">
        <div class="spinner-wrapper">
          <div class="loading-spinner"></div>
        </div>
        <h2 class="redirect-title">正在前往</h2>
        <p class="redirect-desc" id="redirectDesc">即將為您導向...</p>
      </div>

    </div>
  </main>
</body>
</html>
